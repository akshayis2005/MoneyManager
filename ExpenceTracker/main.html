<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expence Tracker - Dashboard</title>
    <link rel="icon" type="image" href="./images/favicon.jpg">

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

    <style>
        body { background-color: #f8f9fa; }
        .form-control:focus, .form-select:focus {
            border-color: #a5acb3;
            box-shadow: 0 0 0 0.25rem rgba(24, 96, 168, 0.2);
        }
        .amount-income { color: #0ba974; font-weight: 600; }
        .amount-expense { color: #6c1516; font-weight: 600; }
    </style>
</head>
<body class="text-dark">

    <nav class="navbar navbar-expand-lg   shadow-sm" style="background-color:white;">
        <div class="container">
            <a class="navbar-brand fw-bold" style="font-family: cursive; font-size: 28px;" href="./main.html">
                Money Manager
            </a>
            <div class="d-flex gap-2">
                <a href="./index.html" class="btn btn-sm btn-outline-light" style="color: #6c1516;">Register</a>
                <button id="clearAllBtn" class="btn btn-sm btn-outline-light" style="color: #6c1516;">Clear All</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">

        <div class="row text-center mb-4">
            <h1 class="fw-bold" style="font-family: cursive; font-size: 44px;">
                <span class="text-dark">M</span>oney
                <span class="text-dark">M</span>anager
            </h1>
            <p class="fw-medium fs-5 fst-italic text-secondary">Track today. Save tomorrow....</p>
        </div>

        <!-- summary cards -->
        <div class="row g-3 mb-4">
            <div class="col-12 col-md-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body text-center">
                        <h5 class="text-secondary">Total Income</h5>
                        <h2 class="amount-income" id="totalIncome">₹0.00</h2>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body text-center">
                        <h5 class="text-secondary">Total Expense</h5>
                        <h2 class="amount-expense" id="totalExpense">₹0.00</h2>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card  text-dark shadow-sm border-0 h-100">
                    <div class="card-body text-center">
                        <h5>Balance</h5>
                        <h2 id="balance" style="font-weight: 600;">₹0.00</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- forms -->
        <div class="row g-4 mb-4">
            <div class="col-12 col-lg-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header  text-white" style="background-color: #0ba974;">
                        <h5 class="mb-0">Add Income</h5>
                    </div>
                    <div class="card-body">
                        <form id="incomeForm">
                            <div class="mb-3">
                                <label for="incomeDescription" class="form-label">Description</label>
                                <input type="text" class="form-control" id="incomeDescription" placeholder="e.g. Salary" required>
                            </div>
                            <div class="mb-3">
                                <label for="incomeCategory" class="form-label">Category</label>
                                <input type="text" class="form-control" id="incomeCategory" placeholder="e.g. trading">
                               
                            </div>
                            <div class="row">
                                <div class="col-7 mb-3">
                                    <label for="incomeAmount" class="form-label">Amount (₹)</label>
                                    <input type="number" class="form-control" id="incomeAmount" min="0.01" step="0.01" placeholder="0.00" required>
                                </div>
                                <div class="col-5 mb-3">
                                    <label for="incomeDate" class="form-label">Date</label>
                                    <input type="date" class="form-control" id="incomeDate" required>
                                </div>
                            </div>
                            <button type="submit" class="btn  w-100" style="background-color: #0ba974; color: antiquewhite;">Add Income</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header  text-white" style="background-color: #6c1516; color:antiquewhite ;">
                        <h5 class="mb-0">Add Expense</h5>
                    </div>
                    <div class="card-body">
                        <form id="expenseForm">
                            <div class="mb-3">
                                <label for="expenseDescription" class="form-label">Description</label>
                                <input type="text" class="form-control" id="expenseDescription" placeholder="e.g. Groceries" required>
                            </div>
                            <div class="mb-3">
                                <label for="expenseCategory" class="form-label">Category</label>
                                                                <input type="text" class="form-control" id="expenseCategory" placeholder="e.g. Rent">

                            
                            </div>
                            <div class="row">
                                <div class="col-7 mb-3">
                                    <label for="expenseAmount" class="form-label">Amount (₹)</label>
                                    <input type="number" class="form-control" id="expenseAmount" min="0.01" step="0.01" placeholder="0.00" required>
                                </div>
                                <div class="col-5 mb-3">
                                    <label for="expenseDate" class="form-label">Date</label>
                                    <input type="date" class="form-control" id="expenseDate" required>
                                </div>
                            </div>
                            <button type="submit" class="btn  w-100" style="background-color: #6c1516;color: antiquewhite;">Add Expense</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- transactions -->
        <div class="card shadow-sm border-0">
            <div class="card-header text-white d-flex justify-content-between align-items-center" style="background-color:black;">
                <h5 class="mb-0">Transactions</h5>
                <span class="badge bg-light text-dark" id="transactionCount">0</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table">
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Type</th>
                                <th class="text-end">Amount</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="transactionBody">
                            <tr>
                                <td colspan="6" class="text-center text-secondary py-4">No transactions yet. Add your first income or expense above.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script src="./tracker.js"></script>
</body>
</html>
